name: Android — compile & test

# Compiles the Android app and runs its unit tests on every pull request that
# touches it. No secrets needed; produces an unsigned debug build only.
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-*.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Unit tests and debug build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain testDebugUnitTest assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log"
      - name: Report build errors as annotations
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/gradle.log"
          # Kotlin/Java compile errors, failed tests, and Gradle's summary.
          grep -E '^e: |error:|FAILED|AAPT|Could not|> ' "$log" | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          awk '/What went wrong/{f=1} f{print} /Try:/{exit}' "$log" | head -30 | sed 's/^/::error::/' 
      - name: Attach debug APK
        uses: actions/upload-artifact@v6
        with:
          name: trexpanda-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
