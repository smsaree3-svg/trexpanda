name: Android — compile & test

# Compiles the Android app and runs its unit tests on every pull request that
# touches it. No secrets needed; produces an unsigned debug build only.
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-*.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 21+: its text segmenter matches the phone's (ICU) for emoji, which the
          # grapheme tests check. The app itself still targets Java 17 bytecode.
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Unit tests and debug build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain testDebugUnitTest assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log"
      - name: Report build errors as annotations
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/gradle.log"
          # GitHub keeps only 10 annotations per step, so send the useful lines as one.
          { awk '/What went wrong/{f=1} f{print} /\* Try:/{exit}' "$log"
            grep -E '^e: |error:|ERROR:|AAPT|FAILED|Unresolved|Could not|Exception|Error|Caused by|at com\.lumisha|at android|at androidx|at com\.google' "$log" | grep -v '^> Task' ; } \
            | head -90 > "$RUNNER_TEMP/errors.txt"
          msg=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/errors.txt" | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle failure::${msg}"
          cat "$RUNNER_TEMP/errors.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach debug APK
        uses: actions/upload-artifact@v6
        with:
          name: trexpanda-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
