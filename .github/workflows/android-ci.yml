name: Android — compile & test

# Compiles the Android app and runs its unit tests on every pull request that
# touches it. No secrets needed; produces an unsigned debug build only.
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-*.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Compile debug build (lint-free compile check)
        run: gradle --no-daemon assembleDebug
      - name: Attach debug APK
        uses: actions/upload-artifact@v6
        with:
          name: trexpanda-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
