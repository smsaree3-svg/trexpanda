name: Android — build & publish to Google Play

# Builds the signed Android App Bundle (.aab) and, when the Play service-account
# secret is present, uploads it to a Google Play track.
#
#  - Push a tag like  android-v0.3.5  to build and upload to the internal track.
#  - Or run it by hand (Actions → this workflow → Run workflow) and pick the track.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_UPLOAD_KEYSTORE_BASE64  base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD       keystore password
#   ANDROID_KEY_ALIAS               key alias inside the keystore
#   ANDROID_KEY_PASSWORD            key password
#   PLAY_SERVICE_ACCOUNT_JSON       Google Play service-account key (JSON). Optional:
#                                   without it the bundle is only attached as an artifact.
# Repository variables (already used by the desktop build):
#   SUPABASE_URL, SUPABASE_ANON_KEY  public values, baked into the app.
#
# Note: Google Play only accepts API uploads after the FIRST bundle for a new app
# has been uploaded by hand in Play Console. Download the .aab artifact from the
# first run and upload it there once.

on:
  push:
    tags:
      - 'android-v*'
  # Publishing a GitHub Release (the same step that ships the desktop app) also
  # ships Android to testers, so one release updates every platform.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: 'Release status (completed = goes straight to testers)'
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: write   # creates the private draft release holding the .aab

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 21+: its text segmenter matches the phone's (ICU) for emoji, which the
          # grapheme tests check. The app itself still targets Java 17 bytecode.
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Version from tag or run number
        id: ver
        shell: bash
        run: |
          # versionCode must increase on every upload and stay above 11 (the APK on trexpanda.com).
          echo "code=$(( 100 + GITHUB_RUN_NUMBER ))" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "name=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(node -p "require('../package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Cloud settings and signing key
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Repository variables SUPABASE_URL and SUPABASE_ANON_KEY must be set for a store build."; exit 1
          fi
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > local.properties
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_UPLOAD_KEYSTORE_BASE64 is missing; Google Play rejects unsigned bundles."; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Unit tests (expansion spec + sync)
        run: gradle --no-daemon testReleaseUnitTest

      - name: Build signed bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          gradle --no-daemon bundleRelease
          -PtrexVersionCode=${{ steps.ver.outputs.code }}
          -PtrexVersionName=${{ steps.ver.outputs.name }}

      - name: Attach bundle
        uses: actions/upload-artifact@v6
        with:
          name: trexpanda-android-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Keep the bundle in a private draft release
        # Draft releases are visible only to repo collaborators. Makes the .aab
        # easy to fetch for manual Play Console uploads (artifacts expire).
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-build-${{ steps.ver.outputs.code }}"
          cp android/app/build/outputs/bundle/release/app-release.aab "trexpanda-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.aab"
          gh release create "$tag" "trexpanda-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.aab" \
            --draft --target "$GITHUB_SHA" --title "Android ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})" \
            --notes "Signed Android App Bundle for Google Play. Private draft — do not publish."

      - name: Check for Play credentials
        id: play
        shell: bash
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "ready=$([ -n "$PLAY_JSON" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play
        if: steps.play.outputs.ready == 'yes'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.lumisha.trexpanda
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}
          releaseName: ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})
