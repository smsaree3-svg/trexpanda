name: iOS — TestFlight testers

# Creates the internal TestFlight group, adds testers, answers export
# compliance for the newest build. Safe to re-run.
on:
  workflow_dispatch:
    inputs:
      testers:
        description: 'Comma-separated email:First:Last'
        default: 'amit@lumisha.in:Amit:Roda,amit.roda@yahoo.co.in:Amit:Roda'
  workflow_run:
    workflows: ['iOS — TestFlight release']
    types: [completed]

permissions:
  contents: read

jobs:
  testers:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TESTERS: ${{ github.event.inputs.testers || 'amit@lumisha.in:Amit:Roda,amit.roda@yahoo.co.in:Amit:Roda' }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure TestFlight
        run: |
          printf '%s' "${{ secrets.APPSTORE_PRIVATE_KEY }}" > "$RUNNER_TEMP/key.p8"
          export KEY_PATH="$RUNNER_TEMP/key.p8"
          pip install -q pyjwt cryptography requests
          python3 ios/ci/asc_testflight.py
          rm -f "$RUNNER_TEMP/key.p8"
