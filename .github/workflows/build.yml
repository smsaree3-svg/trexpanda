name: Build & publish Trexpanda installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Bake the Supabase connection into the build so the packaged app has the
      # cloud features (accounts / friends / sharing) working out of the box.
      # Values come from repository Variables (Settings -> Secrets and variables
      # -> Actions -> Variables): SUPABASE_URL and SUPABASE_ANON_KEY. The anon
      # key is safe to ship in a client — access is controlled by RLS. If the
      # variables aren't set, an empty config is written and the app simply runs
      # with the cloud features switched off (no build failure).
      - name: Bundle Supabase config
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p src/cloud
          node -e "const fs=require('fs');fs.writeFileSync('src/cloud/cloud-config.json',JSON.stringify({url:process.env.SUPABASE_URL||'',anonKey:process.env.SUPABASE_ANON_KEY||''},null,2)+'\n');"
          node -e "const c=require('./src/cloud/cloud-config.json');console.log('cloud-config bundled — url set:',!!c.url,'| anonKey set:',!!c.anonKey);"

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      # Enable code signing ONLY when a certificate secret is actually present.
      # We must not export an empty CSC_LINK — electron-builder would try to
      # resolve "" as a certificate path and fail. So the signing vars are set
      # into $GITHUB_ENV here only if the matching secret is non-empty; otherwise
      # the build runs unsigned and succeeds. See SIGNING.md.
      - name: Configure code signing
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ "${{ matrix.platform }}" = "win" ] && [ -n "$WIN_CSC_LINK" ]; then
            echo "CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing enabled (Windows certificate present)."
          elif [ "${{ matrix.platform }}" = "mac" ] && [ -n "$MAC_CSC_LINK" ]; then
            echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing enabled (macOS certificate present)."
          else
            echo "No signing certificate configured — building unsigned."
          fi

      # macOS: Developer ID signing + Apple notarization. The Developer ID private
      # key (MAC_DEVID_KEY) is the only extra secret; the certificate comes from
      # Apple via the App Store Connect API key, which also notarizes the app.
      - name: Configure Developer ID signing and notarization
        if: matrix.platform == 'mac'
        shell: bash
        env:
          MAC_DEVID_KEY: ${{ secrets.MAC_DEVID_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          if [ -z "$MAC_DEVID_KEY" ] || [ -z "$KEY_ID" ]; then echo "Developer ID key not configured; building unsigned."; exit 0; fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8"
          export KEY_PATH="$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8"
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography requests
          out=$("$RUNNER_TEMP/venv/bin/python" scripts/ci/mac_signing.py)
          echo "$out" >> "$GITHUB_ENV"
          echo "$out" | grep CSC_NAME
          {
            echo "APPLE_API_KEY=$KEY_PATH"
            echo "APPLE_API_KEY_ID=$KEY_ID"
            echo "APPLE_API_ISSUER=$ISSUER_ID"
            echo "TREX_NOTARIZE=-c.mac.notarize=true"
          } >> "$GITHUB_ENV"
          echo "Developer ID signing and notarization enabled."

      # Windows: Microsoft Artifact Signing (Lumisha LLC). Needs the secrets
      # AZURE_TENANT_ID, AZURE_CLIENT_ID and AZURE_CLIENT_SECRET (an app
      # registration with the "Artifact Signing Certificate Profile Signer" role
      # on the signing account). Without them the build stays unsigned.
      - name: Configure Windows signing
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT || 'trexpanda-signing' }}
          SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE || 'trexpanda-public' }}
        run: |
          if (-not $env:AZURE_CLIENT_SECRET -or -not $env:AZURE_CLIENT_ID) { Write-Host "Azure signing not configured; building unsigned."; exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP 'azsign'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client' -OutFile "$dir\client.zip"
          Expand-Archive "$dir\client.zip" -DestinationPath "$dir\client" -Force
          $dlib = Get-ChildItem "$dir\client" -Recurse -Filter 'Azure.CodeSigning.Dlib.dll' | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $dlib) { throw "Azure.CodeSigning.Dlib.dll not found in the NuGet package" }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $meta = Join-Path $dir 'metadata.json'
          @{ Endpoint = $env:SIGN_ENDPOINT; CodeSigningAccountName = $env:SIGN_ACCOUNT; CertificateProfileName = $env:SIGN_PROFILE; ExcludeCredentials = @('ManagedIdentityCredential','WorkloadIdentityCredential','SharedTokenCacheCredential','VisualStudioCredential','VisualStudioCodeCredential','AzureCliCredential','AzurePowerShellCredential','AzureDeveloperCliCredential','InteractiveBrowserCredential') } | ConvertTo-Json | Set-Content -Path $meta -Encoding utf8
          @(
            "TREX_AZURE_SIGN=1",
            "TREX_SIGN_DLIB=$($dlib.FullName)",
            "TREX_SIGN_METADATA=$meta",
            "TREX_SIGNTOOL=$($signtool.FullName)",
            "AZURE_TENANT_ID=$env:AZURE_TENANT_ID",
            "AZURE_CLIENT_ID=$env:AZURE_CLIENT_ID",
            "AZURE_CLIENT_SECRET=$env:AZURE_CLIENT_SECRET"
          ) | Add-Content -Path $env:GITHUB_ENV
          Write-Host "Artifact Signing enabled: $env:SIGN_ACCOUNT / $env:SIGN_PROFILE via $($signtool.FullName)"

      - name: Build the installer
        shell: bash
        run: |
          set -o pipefail
          npm run dist:${{ matrix.platform }} -- $TREX_NOTARIZE 2>&1 | tee "$RUNNER_TEMP/build.log"
        env:
          # No local keychain auto-discovery; signing (if any) comes from the
          # CSC_LINK set by the previous step. Absent that, the build is unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # macOS notarization (only used on the mac runner when these are set).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Lets electron-builder attach update metadata to the GitHub Release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report build errors as annotations
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || exit 0
          grep -iE "⨯|error|failed|notar|codesign|signing|identity|certificate|Invalid|rejected" "$log" | grep -v "^\s*at " | tail -40 > "$RUNNER_TEMP/err.txt" || true
          msg=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/err.txt" | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failure::${msg}"

      - name: Upload installers as artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: trexpanda-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip

      - name: Publish to GitHub Releases
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: Trexpanda ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          # A release created as a pre-release (so the website keeps the old
          # installers while these build) must become "latest" once they're attached.
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            release/Trexpanda-Setup.exe
            release/Trexpanda.dmg
            release/Trexpanda.zip
            release/latest.yml
            release/latest-mac.yml
            release/*.blockmap
