name: Build & publish Trexpanda installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Bake the Supabase connection into the build so the packaged app has the
      # cloud features (accounts / friends / sharing) working out of the box.
      # Values come from repository Variables (Settings -> Secrets and variables
      # -> Actions -> Variables): SUPABASE_URL and SUPABASE_ANON_KEY. The anon
      # key is safe to ship in a client — access is controlled by RLS. If the
      # variables aren't set, an empty config is written and the app simply runs
      # with the cloud features switched off (no build failure).
      - name: Bundle Supabase config
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p src/cloud
          node -e "const fs=require('fs');fs.writeFileSync('src/cloud/cloud-config.json',JSON.stringify({url:process.env.SUPABASE_URL||'',anonKey:process.env.SUPABASE_ANON_KEY||''},null,2)+'\n');"
          node -e "const c=require('./src/cloud/cloud-config.json');console.log('cloud-config bundled — url set:',!!c.url,'| anonKey set:',!!c.anonKey);"

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      # Enable code signing ONLY when a certificate secret is actually present.
      # We must not export an empty CSC_LINK — electron-builder would try to
      # resolve "" as a certificate path and fail. So the signing vars are set
      # into $GITHUB_ENV here only if the matching secret is non-empty; otherwise
      # the build runs unsigned and succeeds. See SIGNING.md.
      - name: Configure code signing
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ "${{ matrix.platform }}" = "win" ] && [ -n "$WIN_CSC_LINK" ]; then
            echo "CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing enabled (Windows certificate present)."
          elif [ "${{ matrix.platform }}" = "mac" ] && [ -n "$MAC_CSC_LINK" ]; then
            echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing enabled (macOS certificate present)."
          else
            echo "No signing certificate configured — building unsigned."
          fi

      - name: Build the installer
        run: npm run dist:${{ matrix.platform }}
        env:
          # No local keychain auto-discovery; signing (if any) comes from the
          # CSC_LINK set by the previous step. Absent that, the build is unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # macOS notarization (only used on the mac runner when these are set).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Lets electron-builder attach update metadata to the GitHub Release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers as artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: trexpanda-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip

      - name: Publish to GitHub Releases
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: Trexpanda ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            release/Trexpanda-Setup.exe
            release/Trexpanda.dmg
            release/Trexpanda.zip
            release/latest.yml
            release/latest-mac.yml
            release/*.blockmap
